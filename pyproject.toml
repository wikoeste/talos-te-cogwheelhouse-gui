[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "talos-te-cogwheelhouse-gui"
version = "0.6.0"
description = "Talos Escalations Team COG Wheelhouse and case-management tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Will Koester", email = "wikoeste@cisco.com" },
]
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Login>=0.6.3,<1",
    "GitPython>=3.1.45,<4",
    "icalendar>=6,<7",
    "jira>=3.10,<4",
    "mysql-connector-python>=9,<27",
    "netaddr>=1.3,<2",
    "pandas>=2.2,<4",
    "pyshark>=0.6,<1",
    "regex>=2024.11.6,<2027",
    "python-dotenv>=1,<2",
    "recurring-ical-events>=3,<4",
    "requests>=2.32,<3",
    "terminaltables>=3.1,<4",
    "urllib3>=2.2,<3",
    "Werkzeug>=3.1,<4",
]

[project.scripts]
talos-te-cogwheelhouse = "server:main"

[project.urls]
Repository = "https://github.com/wikoeste/talos-te-cogwheelhouse-gui"

[tool.setuptools]
include-package-data = true
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["liono*"]

[tool.setuptools.data-files]
"share/talos-te-cogwheelhouse-gui/templates" = ["templates/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/auth" = ["templates/auth/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/bpsearch" = ["templates/bpsearch/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/err" = ["templates/err/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/forms" = ["templates/forms/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/partials" = ["templates/partials/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/replay" = ["templates/replay/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/results" = ["templates/results/*.html"]
"share/talos-te-cogwheelhouse-gui/templates/scripts" = ["templates/scripts/*.html"]
"share/talos-te-cogwheelhouse-gui/static" = ["static/*.csv"]
"share/talos-te-cogwheelhouse-gui/static/css" = ["static/css/*.css"]
"share/talos-te-cogwheelhouse-gui/static/imgs" = ["static/imgs/*"]
"share/talos-te-cogwheelhouse-gui/static/js" = ["static/js/*.js"]
"share/talos-te-cogwheelhouse-gui/liono/pigreplay/snortfiles/lua" = ["liono/pigreplay/snortfiles/lua/*"]
