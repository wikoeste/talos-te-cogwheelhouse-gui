<h1>Talos Jira API Queue Searches</h1>

    <br><br>
    <div class="elasticform">
    <form action="/getjira" method="POST">
        <p>COG: <input type="text" name="cog" /></p>
        <p>THR Queue: <input type="text" name="thr" /></p>
        <p>EERS Queue: <input type="text" name="eers" /></p>
        <p>REZBZ Queue: <input type="text" name="resbz" /></p>
        <p>SHA256 ALL Qs: <input type="text" name="sha256" /></p>
        <p>CVE ALL Qs: <input type="text" name="cve" /></p>
        <input type="submit" value="Submit"></p>
    </form>
