<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f1f21">
    <title>ACE Tix</title>
    <link rel='stylesheet' href = "../../static/css/main.css">
    <meta charset="UTF-8">
    <!-- Drop down navigation bar -->

</head>
<body>
{% include "partials/navigation.html" %}
<h1>Analyst Console Assigned & Unassigned Tickets</h1>


<details class="ticket-list" open>
  <summary><span>Analyst Console tickets</span><span class="ticket-list-hint">Click to minimize or expand</span></summary>
  <div class="ticket-list-content">
    <table>
        <thead>
            <th>ACE Tickets</th>
        </thead>
        <tbody>
          {% for d in data %}
            <tr><td>{{d}}</td></tr>
            {%endfor%}
        </tbody>
    </table>
  </div>
</details>

</body>
</html>
