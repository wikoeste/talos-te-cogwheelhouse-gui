<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f1f21">
    <title>BP Results</title>
    <link rel='stylesheet' href = "../../static/css/main.css">
    <meta charset="UTF-8">
    <!-- Drop down navigation bar -->

</head>
<body>
{% include "partials/navigation.html" %}
<h1>Secure Endpoint BP Search Results</h1>

<br><br>

<main class="results-layout results-layout--two-column">
<section class="result-panel">
    {%for d in data%}
        {{d}}
    <br>
    {%endfor%}
</section>

<br><br>

<section class="result-panel">
    <table border="1">
        <thead>
            <th>Jira THR related tickets</th>
        </thead>
            <tbody>
            {%for r in res%}
            <tr>
                <td>{{r}}</td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
</section>
</main>
<br><br>

<div class="footer">
  <p>Copyright (c) 2022 wikoeste, Cisco Internal Use Only</p>
</div>
</body>
</html>
