   <div class="elasticform">
    <form action="/dropclam" method="POST">
        <br>
        Enter the Clam Sig to Drop: <input type="text" name="sig"/>
        <p>Drop Reason:
        <select name="reason">
            <option value="1">Reviewer rejected</option>
            <option value="2">Failed FP check</option>
            <option value="3">FP in field</option>
            <option value="4">Replaced</option>
            <option value="5">Other</option>
        </select></p>
        Enter Notes on Drop:
        <input type="text" name="notes"/>
        <p><input type="submit" value="Submit"></p>
    </form>
</div>
