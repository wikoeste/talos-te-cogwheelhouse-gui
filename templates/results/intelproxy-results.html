<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f1f21">
    <meta charset="UTF-8">
    <title>IntelDB Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <!-- menu bar -->

</head>
<body>
{% include "partials/navigation.html" %}
<h1>Intelligent Proxy Results</h1>


<table>
    <tr>
        <th>Entry</th>
        <th>Feed</th>
    </tr>
    <tbody>
        {% for r in res %}
        {% for f in feed %}
        <tr>
            <td>{{r}}</td>
            <td>{{f}}</td>
        </tr>
        {% endfor %}
        {% endfor %}
        <tr>
            <td>Time to Run: </td>
            <td>{{time}}</td>
        </tr>
    </tbody>
</table>
<br><br>
</body>
<div class="footer">
  <p>Copyright (c) 2022 wikoeste, Cisco Internal Use Only</p>
</div>
</body>
</html>
